# DigitalOcean App Platform - Replace JStoweYouKnow/codereview-ai with owner/repo (e.g. myorg/codereview-ai)
name: codereview-ai
region: nyc

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: webhook-service
        preserve_path_prefix: true
    - match:
        path:
          prefix: /health
      component:
        name: webhook-service
        preserve_path_prefix: true
    - match:
        path:
          prefix: /webhooks
      component:
        name: webhook-service
        preserve_path_prefix: true
    - match:
        path:
          prefix: /inference
      component:
        name: inference-service
    - match:
        path:
          prefix: /
      component:
        name: dashboard

# Use external managed PostgreSQL - set DATABASE_URL (doadmin) in App Platform UI for webhook-service
services:
  - name: webhook-service
    github:
      repo: JStoweYouKnow/codereview-ai
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: Dockerfile.webhook
    http_port: 3000
    health_check:
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      http_path: /health
      port: 3000
    envs:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        type: SECRET
      - key: INFERENCE_SERVICE_URL
        value: ${inference-service.PUBLIC_URL}
      - key: GITHUB_APP_ID
        type: SECRET
      - key: GITHUB_PRIVATE_KEY
        type: SECRET
      - key: GITHUB_WEBHOOK_SECRET
        type: SECRET
      - key: GITLAB_TOKEN
        type: SECRET
      - key: CORS_ORIGIN
        value: ${dashboard.PUBLIC_URL}

  - name: inference-service
    github:
      repo: JStoweYouKnow/codereview-ai
      branch: main
      deploy_on_push: true
    source_dir: apps/inference-service
    environment_slug: python
    run_command: python src/server.py
    http_port: 8000
    envs:
      - key: GRADIENT_MODEL_ACCESS_KEY
        type: SECRET
      - key: GRADIENT_MODEL
        value: "anthropic-claude-3.5-sonnet"

  - name: dashboard
    github:
      repo: JStoweYouKnow/codereview-ai
      branch: main
      deploy_on_push: true
    source_dir: .
    dockerfile_path: Dockerfile.dashboard
    http_port: 80
    envs:
      # Override VITE_API_URL in App Platform UI with your app URL (bindable vars fail at Docker build)
      - key: VITE_API_URL
        value: ${webhook-service.PUBLIC_URL}
        scope: RUN_AND_BUILD_TIME
